name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'NPM dist-tag (default: latest)'
        required: false
        default: 'latest'
      otp:
        description: 'NPM OTP (One-Time Password from Authenticator app, only if token requires 2FA)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build & Publish Packages to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Core, Browser, Node & Next.js Packages
        run: |
          pnpm --filter @ichnois/core build
          pnpm --filter @ichnois/browser-utils build
          pnpm --filter @sentry-internal/integration-shims build
          pnpm --filter @sentry-internal/replay-worker build
          pnpm --filter @ichnois/replay build
          pnpm --filter @ichnois/replay-canvas build
          pnpm --filter @ichnois/feedback build
          pnpm --filter @ichnois/browser build
          pnpm --filter @ichnois/bundler-plugins build
          pnpm --filter @ichnois/server-utils build
          pnpm --filter @ichnois/server-runtime-injection build
          pnpm --filter @ichnois/opentelemetry build
          pnpm --filter @ichnois/node build
          pnpm --filter @ichnois/react build
          pnpm --filter @ichnois/vercel-edge build
          pnpm --filter @ichnois/cloudflare build
          pnpm --filter @ichnois/nextjs build

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          OTP_ARG=""
          if [ -n "${{ github.event.inputs.otp }}" ]; then
            OTP_ARG="--otp=${{ github.event.inputs.otp }}"
          fi

          TARGETS=(
            "@ichnois/core"
            "@ichnois/browser-utils"
            "@ichnois/replay"
            "@ichnois/replay-canvas"
            "@ichnois/feedback"
            "@ichnois/browser"
            "@ichnois/bundler-plugins"
            "@ichnois/server-utils"
            "@ichnois/server-runtime-injection"
            "@ichnois/opentelemetry"
            "@ichnois/node"
            "@ichnois/react"
            "@ichnois/vercel-edge"
            "@ichnois/cloudflare"
            "@ichnois/nextjs"
          )
          for pkg in "${TARGETS[@]}"; do
            echo "Publishing $pkg to npm..."
            pnpm --filter "$pkg" publish --access public --no-git-checks $OTP_ARG --tag "${{ github.event.inputs.dist_tag || 'latest' }}"
          done
